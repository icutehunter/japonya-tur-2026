<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Japonya Rotamız 🇯🇵 | Tokyo & Osaka Akıllı Rehber</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .cloud-bg {
      background: linear-gradient(180deg, #dbe9f6 0%, #eef4fa 26%, #f6f8fb 65%, #f6f8fb 100%);
    }
    .dark .cloud-bg {
      background: linear-gradient(180deg, #0c1220 0%, #090e1a 45%, #060911 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .dark .glass-card {
      background: rgba(21, 29, 44, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .floating-dock {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 14px 36px -6px rgba(15, 23, 42, 0.18);
    }
    .dark .floating-dock {
      background: rgba(23, 32, 50, 0.94);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 14px 36px -6px rgba(0, 0, 0, 0.65);
    }
    .leaflet-container { z-index: 10 !important; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="cloud-bg min-h-screen text-slate-800 dark:text-slate-100 pb-32 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
